[project]
name = "flipodoro"
version = "1.1.0"
description = "A minimal, beautiful flip clock Pomodoro timer for Windows"
authors = [
    { name = "Lina", email = "lina.doering@hsbi.de" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
flipodoro = "flipodoro:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
